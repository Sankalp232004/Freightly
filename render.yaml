databases:
  - name: freightly-db
    databaseName: freightly
    user: freightly
    plan: free

services:
  - type: web
    name: freightly
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: freightly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ORS_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
