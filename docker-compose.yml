services:
  db:
    image: postgres:15-alpine
    container_name: freightly-postgres
    environment:
      POSTGRES_USER: freightly
      POSTGRES_PASSWORD: freightly
      POSTGRES_DB: freightly
    ports:
      - "5434:5432"
    volumes:
      - freightly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightly"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:15-alpine
    container_name: freightly-postgres-test
    environment:
      POSTGRES_USER: freightly
      POSTGRES_PASSWORD: freightly
      POSTGRES_DB: freightly_test
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  freightly_pgdata:
